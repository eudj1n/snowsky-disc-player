name: Release

# A tag v<version> (owner, 2026-10-02: releases by tags, not by pushes) releases
# the page: the checks, the card's zip as a GitHub release asset, and the hosted
# site on Pages. The tag goes on a commit that passed CI and, before the owner's
# card, the emulator acceptance (docs/release.md). The zip is packed without a
# service checkout from the reviewed release/origins.json (scripts/pack-app.mjs).
# The tag must be package.json's version, and the release's notes are its dated
# section of CHANGELOG.md (scripts/release-notes.mjs).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Checks and the card's zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # the boot layer's and the server's reviewed pin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: The version and its notes
        run: mkdir -p work && node scripts/release-notes.mjs "$TAG" > work/release-notes.md
      - run: npm ci
      - run: npm run check
      - name: Pack the app
        run: |
          version="${TAG#v}"
          zip="work/disc-player-${version}.zip"
          DISC_RELEASE_WITHOUT_SERVICE=1 DISC_APP_VERSION="$version" node scripts/prepare-release.mjs "$zip"
          python3 -m zipfile -t "$zip"
          (cd work && sha256sum "disc-player-${version}.zip" > "disc-player-${version}.zip.sha256")
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          gh release create "$TAG" "work/disc-player-${version}.zip" "work/disc-player-${version}.zip.sha256" \
            --verify-tag --title "Disc Player ${version}" --notes-file work/release-notes.md

  pages:
    name: Hosted site
    needs: bundle
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
